[package]
name = "noviscia-client"
version = "0.1.0"
edition = "2021"
description = "RPC + Jito bundle submission client for the Noviscia protocol."
license = "Apache-2.0"

[dependencies]
solana-client = "2"
solana-sdk = "2"
solana-program = "2"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
noviscia-types = { path = "../noviscia-types" }
