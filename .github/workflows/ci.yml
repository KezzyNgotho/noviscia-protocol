name: CI

on:
  push:
  pull_request:

jobs:
  test-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node deps
        working-directory: sdk/gateway
        run: npm ci
      - name: Run gateway tests
        working-directory: sdk/gateway
        run: npm test

  test-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cargo check netting-engine
        run: cargo check -p netting-engine
