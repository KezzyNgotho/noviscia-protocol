[toolchain]
anchor_version = "0.31.1"

[workspace]
members = [
    "programs/noviscia-tvv-gate",
    "programs/noviscia-omni-pool",
]

[features]
resolution = true
skip-lint = false

[provider]
cluster = "devnet"
wallet = "~/.config/solana/new-id.json"

[programs.devnet]
noviscia_tvv_gate = "A1cYVV1PjhHgJfiKZzPsjo6Bf7E8NNkMdiv4xNkTaU9g"
noviscia_omni_pool = "2t5zfcgpdWW5MH4PrQjRDyqVB5MhbwwKFFQJN3VZogAr"

[programs.localnet]
noviscia_tvv_gate = "A1cYVV1PjhHgJfiKZzPsjo6Bf7E8NNkMdiv4xNkTaU9g"
noviscia_omni_pool = "2t5zfcgpdWW5MH4PrQjRDyqVB5MhbwwKFFQJN3VZogAr"

[programs.mainnet]
# Same keypairs as devnet; set/verify mainnet addresses before launch.
noviscia_tvv_gate = "A1cYVV1PjhHgJfiKZzPsjo6Bf7E8NNkMdiv4xNkTaU9g"
noviscia_omni_pool = "2t5zfcgpdWW5MH4PrQjRDyqVB5MhbwwKFFQJN3VZogAr"

[scripts]
test = "echo 'Use cargo test --workspace for Rust tests and npm test in app/web for frontend tests'"

[hooks]

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = true

[test.validator]
bind_address = "0.0.0.0"
ledger = ".anchor/test-ledger"
rpc_port = 8899

