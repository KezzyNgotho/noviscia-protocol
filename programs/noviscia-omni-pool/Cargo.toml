[package]
name = "noviscia-omni-pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "noviscia_omni_pool"

[dependencies]
anchor-lang = { version = "1.0.3", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1" }
spl-token = "7"
noviscia-tvv-gate = { path = "../noviscia-tvv-gate", features = ["cpi"] }

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]