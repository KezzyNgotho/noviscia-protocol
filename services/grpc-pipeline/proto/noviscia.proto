syntax = "proto3";
package noviscia.pipeline;

service NovisciaStream {
  rpc GetMarketState (MarketStateRequest) returns (MarketStateResponse);
  rpc GetPosition (PositionRequest) returns (PositionResponse);
  rpc GetCreditStatus (CreditStatusRequest) returns (CreditStatusResponse);
  rpc GetPoolState (PoolStateRequest) returns (PoolStateResponse);
  rpc GetCapacityStatus (CapacityStatusRequest) returns (CapacityStatusResponse);
  rpc GetTrancheState (TrancheStateRequest) returns (TrancheStateResponse);
  rpc GetDeskStatus (DeskStatusRequest) returns (DeskStatusResponse);
  rpc StreamEvents (StreamEventsRequest) returns (stream EventEnvelope);
  rpc SubmitTransaction (SubmitTxRequest) returns (SubmitTxResponse);
  rpc SubmitBundle (BundleRequest) returns (BundleResponse);
}

message MarketStateRequest { string market = 1; }
message MarketStateResponse {
  string market = 1;
  double price = 2;
  double confidence = 3;
  int64 publish_time = 4;
  double funding_rate = 5;
  int64 slot = 6;
}

message PositionRequest { string wallet = 1; string market = 2; }
message PositionResponse {
  string wallet = 1;
  string market = 2;
  bool is_long = 3;
  double size_usdc = 4;
  double entry_price = 5;
  double unrealized_pnl = 6;
  double margin_balance = 7;
  int64 opened_slot = 8;
}

message CreditStatusRequest { string wallet = 1; }
message CreditStatusResponse {
  string wallet = 1;
  double credit_limit = 2;
  double outstanding = 3;
  double utilization_bps = 4;
  double toll_rate_bps = 5;
  bool authorized = 6;
}

message PoolStateRequest { string pool_label = 1; }
message PoolStateResponse {
  string pool_label = 1;
  bool kyc_required = 2;
  double total_shares = 3;
  double base_reserve = 4;
  double quote_reserve = 5;
  int64 lp_count = 6;
  bool is_paused = 7;
}

message StreamEventsRequest {
  repeated string event_types = 1;
  string wallet_filter = 2;
}

message EventEnvelope {
  string event_type = 1;
  int64 slot = 2;
  int64 timestamp = 3;
  string data = 4;
  string tx_signature = 5;
}

message SubmitTxRequest {
  bytes transaction = 1;
  bool use_jito = 2;
  int64 tip_lamports = 3;
}

message SubmitTxResponse {
  bool success = 1;
  string signature = 2;
  string error = 3;
  string bundle_id = 4;
}

// Capacity engine (single-slot clearing & risk) status.
message CapacityStatusRequest { string operator = 1; }
message CapacityStatusResponse {
  string operator = 1;
  int64 credit_limit = 2;
  int64 active_utilization = 3;
  int64 available_balance = 4;
  int64 margin_posted = 5;
  int32 tier = 6;
  int64 premium_multiplier_bps = 7;
  bool frozen = 8;
  bool kyc_verified = 9;
  int64 slot = 10;
  int64 current_premium_bps = 11;
  int64 load_ratio_bps = 12;
}

// Dual-tranche vault state.
message TrancheStateRequest { string tranche_label = 1; }
message TrancheStateResponse {
  string tranche_label = 1;
  int64 nav_usdc = 2;
  int64 total_shares = 3;
  int64 share_price = 4;
  int64 loss_cap_bps = 5;
  bool accepts_deposits = 6;
}

// Asset-engine desk (floating KYC window) — Risk Sentinel peak view.
message DeskStatusRequest { string institution = 1; string mint = 2; }
message DeskStatusResponse {
  string institution = 1;
  string mint = 2;
  int64 active_principal = 3;
  int64 accumulated_premiums = 4;
  int64 window_start_slot = 5;
  int64 peak_active_utilization = 6;
  int64 last_settlement_timestamp = 7;
}

// Atomic Jito bundle submission: Transaction A (premium/capacity) + Transaction B (trade).
message BundleRequest {
  repeated bytes transactions = 1;
  int64 tip_lamports = 2;
  string operator = 3;
  int64 desired_capacity = 4;
  int64 expiry = 5;
  repeated bytes merkle_proof = 6;
}
message BundleResponse {
  bool success = 1;
  string bundle_id = 2;
  string status = 3;
  string error = 4;
}
