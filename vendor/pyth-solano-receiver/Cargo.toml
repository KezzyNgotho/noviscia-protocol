[package]
name = "pyth-solano-receiver"
version = "0.2.1"
description = "Vendored Pyth Solana Receiver program (upstream pyth-crosschain target_chains/solana/programs/pyth-solano-receiver @ 4f7d3c5324659f3a24be13212e07f7574c51f17d, trimmed to the post_update_atomic + governance surface)"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "pyth_solano_receiver"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
test-bpf = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
solana-program = "4"
pythnet-sdk = { version = "2.1.0", features = [
    "solana-program",
] }
byteorder = "1.4.3"
wormhole-core-bridge-solana = { path = "../wormhole-core-bridge-solana" }
wormhole-raw-vaas = { version = "0.1.3", features = [
    "ruint",
    "on-chain",
], default-features = false }
pyth-solana-receiver-sdk = "0.6.1"
rand = "0.8.5"