[workspace]
members = [
    "programs/escrow",
    "programs/lending-integrator",
    "programs/staking-manager",
    "programs/burn-engine",
    "programs/token-nvsc",
    "programs/yield-distributor"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
solana-program = "1.18.0"
spl-token = "4.0.0"

[profile.release]
overflow-checks = true