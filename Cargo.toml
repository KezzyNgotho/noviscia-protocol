[workspace]
members = [
    "programs/escrow",
    "programs/nv-usdc-vault",
    "programs/staking-manager",
    "programs/burn-engine",
    "programs/token-nvsc",
    "programs/yield-distributor",
    "programs/liquidation-vault",
    "programs/protocol-lp-vault",
    "programs/position-tracker",
    "programs/noviscia-clearing",
    "programs/bug-bounty",
    "programs/netting-engine",
    "programs/yield-router",
    "programs/clearing-registry",
    "programs/spot-dex",
    "programs/cross-border",
    "programs/tbill-fund",
    "mocks/mock-pyth-receiver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-program = "2"
spl-token = "7"

[profile.release]
overflow-checks = true
lto = true
opt-level = 's'
strip = true
codegen-units = 1
panic = 'abort'