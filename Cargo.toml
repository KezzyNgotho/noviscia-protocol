[workspace]
members = [
    "programs/noviscia-tvv-gate",
    "programs/noviscia-omni-pool",
    "sdk/rust/noviscia-credit-line",
    "sdk/rust/noviscia-types",
    "sdk/rust/noviscia-client",
    "sdk/rust/noviscia-trading",
    "sdk/rust/noviscia-credit",
    "sdk/rust/noviscia-pool",
    "sdk/rust/noviscia-merge",
    "sdk/rust/noviscia-capacity-sdk",
    "sdk/rust/noviscia-asset-engine-sdk",
    "sdk/rust/noviscia-tvv",
    "vendor/wormhole-core-bridge-solana",
    "vendor/pyth-solano-receiver",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
solana-program = "2"
spl-token = "7"

[profile.release]
overflow-checks = true
lto = true
opt-level = 's'
strip = true
codegen-units = 1
panic = 'abort'