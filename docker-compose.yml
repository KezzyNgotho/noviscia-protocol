version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: novisca-postgres
    environment:
      POSTGRES_DB: novisca
      POSTGRES_USER: novisca
      POSTGRES_PASSWORD: novisca-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novisca"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: novisca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Legacy Express API — see app/api/DEPRECATED.md (Next.js app/web is the real API)
  api:
    profiles: [legacy-api]
    build:
      context: ./app/api
      dockerfile: Dockerfile
    container_name: novisca-api
    environment:
      DATABASE_URL: postgresql://novisca:novisca-dev-password@postgres:5432/novisca
      REDIS_URL: redis://redis:6379
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      SOLANA_RPC_MAINNET: https://api.mainnet-beta.solana.com
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # WebSocket Server
  websocket:
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    container_name: novisca-websocket
    environment:
      WEBSOCKET_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Price Feed Service
  price-feed:
    build:
      context: ./services/price-feed
      dockerfile: Dockerfile
    container_name: novisca-price-feed
    environment:
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
    depends_on:
      - websocket
    restart: unless-stopped

  # Indexer Service
  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    container_name: novisca-indexer
    environment:
      DATABASE_URL: postgresql://novisca:novisca-dev-password@postgres:5432/novisca
      SOLANA_RPC_DEVNET: https://api.devnet.solana.com
      INDEXER_PORT: 8092
      INDEXER_INGEST_SECRET: ee7629e75c83d902059e3befe0f4f218f16a48353cef6e3faf3f72caaaad145a
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: noviscia-ai-orchestrator
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      AI_PORT: 11435
    ports:
      - "11435:11435"
    restart: unless-stopped

  ai-rebalancer:
    build:
      context: ./services/ai-rebalancer
      dockerfile: Dockerfile
    container_name: noviscia-ai-rebalancer
    environment:
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:11435
      NOVISCIA_API_URL: http://api:3001
      NOVISCIA_WEB_URL: http://web:3000
      AI_REBALANCE_INTERVAL_MS: 3600000
    depends_on:
      - ai-orchestrator
      - api
    restart: unless-stopped

  # Web Frontend (optional, use npm run dev instead)
  web:
    build:
      context: ./app/web
      dockerfile: Dockerfile
    container_name: novisca-web
    environment:
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:11435
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8080
      NEXT_PUBLIC_SOLANA_RPC: https://api.devnet.solana.com
      NEXT_PUBLIC_CLUSTER: devnet
      PERPS_INDEXER_URL: http://indexer:8092
      NEXT_PUBLIC_USDC_MINT: Cx2bfKM7hcpnreSZxiDaN8q4Ca9i5ViCLxqRTs12JhS5
      NEXT_PUBLIC_NVSCUSDC_MINT: 2TmaUey4Hh2om1kFR77Vw1RDh8H69qcW6UAACVidJeVk
      NEXT_PUBLIC_BURN_VAULT_USDC: 5gXoi3aqnomJiCZkE6ta5T7tJKNvW9GfNrfHEncsLnna
      NEXT_PUBLIC_POSITION_TRACKER_PROGRAM_ID: 3zGRWKZq4V3npHbH9Lati46BwgmstTjynWZFFMxarQgY
      NEXT_PUBLIC_ESCROW_PROGRAM_ID: CTmCryJca9cFyMRaGdzrhyZeEnjdGLD8ZkEqNcNbvh2D
      NEXT_PUBLIC_LENDING_PROGRAM_ID: Ea5TXHxsVcnKwMAcAsQkpPN88xr8ndBRpNGDkREWrbSZ
      NEXT_PUBLIC_BURN_PROGRAM_ID: nFgJEQSrKEi7FdAKC6vz5HsQ6f9QjQLBuQcQqQy45id
      NEXT_PUBLIC_STAKING_PROGRAM_ID: 4VDQjH73DiE3zYt66ukyWY7KMMJrxHUZfjkxRHTPDG75
      NEXT_PUBLIC_NV_USDC_VAULT_PROGRAM_ID: CN92hAtnZxbMxPdho8tugi9GDK86UpGwmnbEvk5yzAWC
      NEXT_PUBLIC_LIQUIDATION_VAULT_PROGRAM_ID: C5mvuPTN7KHQ1NsXSUcD2tEae9fL1pLrNkZD67jRRuf1
    ports:
      - "3000:3000"
    depends_on:
      - indexer
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: novisca-network
