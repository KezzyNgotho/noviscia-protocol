services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: novisca-postgres
    environment:
      POSTGRES_DB: novisca
      POSTGRES_USER: novisca
      POSTGRES_PASSWORD: novisca-dev-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novisca"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: novisca-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # WebSocket Server
  websocket:
    build:
      context: ./services/websocket
      dockerfile: Dockerfile
    container_name: novisca-websocket
    environment:
      WEBSOCKET_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Price Feed Service
  price-feed:
    build:
      context: ./services/price-feed
      dockerfile: Dockerfile
    container_name: novisca-price-feed
    environment:
      SOLANA_RPC_DEVNET: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
    ports:
      - "8082:8082"
    depends_on:
      - websocket
    restart: unless-stopped

  # Indexer Service
  indexer:
    build:
      context: ./services/indexer
      dockerfile: Dockerfile
    container_name: novisca-indexer
    environment:
      DATABASE_URL: postgresql://novisca:novisca-dev-password@postgres:5432/novisca
      SOLANA_RPC_DEVNET: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      INDEXER_PORT: 8092
      # Pass via .env file or environment
      INDEXER_INGEST_SECRET: ${INDEXER_INGEST_SECRET}
    ports:
      - "8092:8092"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ai-orchestrator:
    build:
      context: ./services/ai-orchestrator
      dockerfile: Dockerfile
    container_name: novisca-ai-orchestrator
    environment:
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen2.5:7b
      AI_PORT: "11435"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Web Frontend (optional, use npm run dev instead)
  web:
    build:
      context: ./app/web
      dockerfile: Dockerfile
    container_name: novisca-web
    environment:
      AI_ORCHESTRATOR_URL: http://ai-orchestrator:11435
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WEBSOCKET_URL: ws://localhost:8080
      NEXT_PUBLIC_SOLANA_RPC: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      NEXT_PUBLIC_CLUSTER: devnet
      PERPS_INDEXER_URL: http://indexer:8092
      NEXT_PUBLIC_USDC_MINT: Cx2bfKM7hcpnreSZxiDaN8q4Ca9i5ViCLxqRTs12JhS5
      NEXT_PUBLIC_NVSCUSDC_MINT: 2TmaUey4Hh2om1kFR77Vw1RDh8H69qcW6UAACVidJeVk
      NEXT_PUBLIC_BURN_VAULT_USDC: 5gXoi3aqnomJiCZkE6ta5T7tJKNvW9GfNrfHEncsLnna
      NEXT_PUBLIC_POSITION_TRACKER_PROGRAM_ID: 6uvr2JcP2iMQooG76RjpCtJLoJ4NuptGyRCiMKuDR1ws
      NEXT_PUBLIC_ESCROW_PROGRAM_ID: 2WPb3wsyp4G6zFPx8sTYf3bTDyySxwpo1Ja8H6RCHXCZ
      NEXT_PUBLIC_LENDING_PROGRAM_ID: Ea5TXHxsVcnKwMAcAsQkpPN88xr8ndBRpNGDkREWrbSZ
      NEXT_PUBLIC_BURN_PROGRAM_ID: nFgJEQSrKEi7FdAKC6vz5HsQ6f9QjQLBuQcQqQy45id
      NEXT_PUBLIC_STAKING_PROGRAM_ID: HjxcKV51A7jxE2iqMCDY7EvWFL9XsheuM43DamWGabqb
      NEXT_PUBLIC_NV_USDC_VAULT_PROGRAM_ID: CN92hAtnZxbMxPdho8tugi9GDK86UpGwmnbEvk5yzAWC
      NEXT_PUBLIC_LIQUIDATION_VAULT_PROGRAM_ID: Cwma3FfMKhoLkgfrGYgErVPoFWEtHpx7DNc4wArpRHBz
    ports:
      - "3000:3000"
    depends_on:
      - indexer
    restart: unless-stopped

  # Liquidation Keeper — HF position watch, JIT pricing, atomic-recall liquidations
  liquidation-keeper:
    build:
      context: ./services/liquidation-keeper
      dockerfile: Dockerfile
    container_name: novisca-liquidation-keeper
    environment:
      SOLANA_RPC_DEVNET: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      EXECUTOR_KEYPAIR_PATH: /keys/new-id.json
      WS_INGEST_URL: http://websocket:8080
      WS_INGEST_SECRET: ${WS_INGEST_SECRET:-}
      KEEPER_ENABLE_ATOMIC_RECALL: "true"
      KEEPER_ENABLE_FUNDING: "true"
      POLL_INTERVAL_MS: ${KEEPER_POLL_MS:-15000}
      HEALTH_PORT: "8081"
      CIRCUIT_BREAKER_THRESHOLD: ${KEEPER_CIRCUIT_BREAKER:-5}
    ports:
      - "8081:8081"
    volumes:
      - ${KEYPAIR_DIR:-~/.config/solana}:/keys:ro
      - ./target/idl:/target/idl:ro
    depends_on:
      - websocket
    restart: unless-stopped

  # Risk Engine — VaR / Expected-Shortfall analytics over the netting house book
  risk-engine:
    build:
      context: ./services/risk-engine
      dockerfile: Dockerfile
    container_name: novisca-risk-engine
    environment:
      SOLANA_RPC_DEVNET: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      WS_INGEST_URL: http://websocket:8080
      WS_INGEST_SECRET: ${WS_INGEST_SECRET:-}
      RISK_PORT: 8095
    ports:
      - "8095:8095"
    volumes:
      - ./target/idl:/target/idl:ro
    depends_on:
      - websocket
    restart: unless-stopped

  # Netting Relayer — permissionless consolidate crank: keeps every trader's
  # NettingSet.margin_required_usdc and the house-book default-fund target live
  # so the netting-engine risk policy actually gates position-tracker opens.
  netting-relayer:
    build:
      context: ./services/netting-relayer
      dockerfile: Dockerfile
    container_name: novisca-netting-relayer
    environment:
      SOLANA_RPC_DEVNET: ${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      RELAYER_KEYPAIR_PATH: /keys/relayer-keypair.json
      POLL_INTERVAL_MS: ${POLL_INTERVAL_MS:-15000}
    ports:
      - "8085:8085"
    volumes:
      - ${KEYPAIR_DIR:-~/.config/solana}:/keys:ro
      - ./target/idl:/target/idl:ro
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: novisca-network
